<html>
  <head>
    <script type="importmap">
      {
	"imports": {
	  "uuid": "./uuid/index.js",
	  "@yz-social/kdht": "./kdht/index.js",
	  "@yz-social/webrtc": "./webrtc/index.js"
	}
      }
    </script>
  </head>
  <body>
    <button id="update">update node display</button><pre id="display"></pre><br/>
    <input type="text" id="key" value="foo" placeholder="key to read or write under"></input><br/>
    <input type="text" id="readValue" placeholder="read value" readonly></input> <button id="read">subscribe</button><br/>
    <input type="text" id="writeValue" placeholder="value to write"></input> <button id="write">publish</button><br/>
    <script type="module">
      import { v4 as uuidv4 } from 'uuid';
      import kdht from '@yz-social/kdht';
      Object.assign(globalThis, {uuidv4, kdht });
      const bootstrapBase = new URL('/kdht', origin).href; // Must be a string
      let contact;

      async function connect() { // Connect or reconnect to the network.
	const name = uuidv4();
	contact = globalThis.contact = await kdht.WebContact.create({name});
	const bootstrapName = await contact.fetchBootstrap(bootstrapBase);
	console.log('connecting to', bootstrapName);
	const bootstrapContact = globalThis.bootstrapContact = await contact.ensureRemoteContact(bootstrapName, bootstrapBase);
	await contact.join(bootstrapContact);
	contact.host.subscribe({eventName: 'network statistics', handler: item => item.payload.storage.count && item.payload.storage.count});
	update.onclick();
	return contact;
      }

      update.onclick = () => display.textContent = contact.node.report(null);
      write.onclick = () => contact.host.publish({eventName: key.value, payload: writeValue.value});
      read.onclick = () => contact.host.subscribe({eventName: key.value,
						   handler: storageItem => {
						     readValue.value = `${storageItem?.payload} @${new Date(storageItem?.issuedTime).toLocaleTimeString()}`;
						   }});
      document.addEventListener("visibilitychange", () => {
	if (document.hidden) {
	  contact.disconnect();
	} else {
	  connect();
	}
      });
      await connect();
    </script>
  </body>    
</html>
